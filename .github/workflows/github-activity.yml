name: GitHub activity

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stats-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/github-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- github.json && git ls-files --error-unmatch github.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "live-stats bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github.json
          git commit -m "Update GitHub activity"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
